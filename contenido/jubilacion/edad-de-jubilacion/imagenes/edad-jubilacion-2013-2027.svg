<text x="48" y="66" font-family="'Liberation Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start">Edad de jubilación en España, 2013-2027</text>
<text x="48" y="102" font-family="'Liberation Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">La subida gradual termina en 2027: 67 años, o 65 si has cotizado 38 años y 6 meses</text>
<text x="48" y="168" font-family="'Liberation Sans', 'DejaVu Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Edad exigida sin cotización larga</text>
