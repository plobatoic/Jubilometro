<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Jubilómetro</title>
<style>
  :root {
    --fondo: #0b1220; --fondo-2: #13213b; --tinta: #f4f7fb; --tenue: #a8b4c7; --tenue-2: #7d8aa0;
    --acento: #7fb1ea; --acento-fuerte: #3d86e0; --verde: #6fd3a0; --rojo: #ff7a70; --ambar: #ffcd6b;
    --superficie: rgba(255,255,255,0.065); --borde: rgba(255,255,255,0.13);
    --fuente: "Inter Display", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
  body { font-family: var(--fuente); color: var(--tinta); font-feature-settings: "tnum" 1, "ss01" 1; -webkit-font-smoothing: antialiased; }

  /* ---------- Fondo ---------- */
  #fondo { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(900px 900px at var(--gx, 20%) var(--gy, 18%), rgba(61,134,224,0.30), transparent 70%),
      radial-gradient(800px 800px at var(--hx, 85%) var(--hy, 88%), rgba(111,211,160,0.16), transparent 70%),
      linear-gradient(180deg, var(--fondo-2) 0%, var(--fondo) 62%); }
  #rejilla { position: absolute; inset: -80px; opacity: 0.07;
    background-image: linear-gradient(rgba(255,255,255,1) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,1) 1.5px, transparent 1.5px);
    background-size: 90px 90px; transform: translateY(var(--ry, 0px)); }
  #marca-agua { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-weight: 900; font-size: 430px;
    letter-spacing: -0.06em; color: rgba(255,255,255,0.035); line-height: 1; white-space: nowrap; }

  /* ---------- Cabecera ---------- */
  #cabecera { position: absolute; top: 168px; left: 80px; right: 80px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 38px; letter-spacing: -0.01em; }
  .logo svg { width: 58px; height: 58px; }
  .tema { font-size: 26px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento);
    border: 2px solid rgba(127,177,234,0.45); padding: 10px 20px; border-radius: 999px; background: rgba(127,177,234,0.08); }
  #progreso { position: absolute; top: 258px; left: 80px; right: 80px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  #progreso i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acento), var(--verde)); border-radius: 3px; }

  /* ---------- Escenario ---------- */
  #escenario { position: absolute; top: 310px; left: 0; right: 0; height: 960px; }
  .escena { position: absolute; inset: 0; padding: 0 80px; display: flex; flex-direction: column; justify-content: center; gap: 34px; opacity: 0; }

  .kicker { font-size: 44px; font-weight: 800; color: var(--acento); letter-spacing: -0.01em; }
  .titular { font-size: 112px; font-weight: 900; line-height: 0.98; letter-spacing: -0.045em; text-wrap: balance; }
  .titular.m { font-size: 92px; }
  .titular.s { font-size: 76px; }
  .sub { font-size: 46px; font-weight: 600; color: var(--tenue); line-height: 1.22; text-wrap: balance; }
  .nota { font-size: 34px; font-weight: 500; color: var(--tenue-2); line-height: 1.35; text-wrap: pretty; }
  .cifra { font-size: 230px; font-weight: 900; letter-spacing: -0.06em; line-height: 0.9; white-space: nowrap; }
  .cifra.m { font-size: 170px; }
  .cifra.s { font-size: 128px; }
  .cifra.xs { font-size: 100px; letter-spacing: -0.045em; }
  .cifra.fecha { font-size: 150px; }
  .rojo { color: var(--rojo); } .verde { color: var(--verde); } .ambar { color: var(--ambar); } .azul { color: var(--acento); } .tenue { color: var(--tenue); }
  mark { background: none; color: var(--ambar); position: relative; }
  .centro { text-align: center; align-items: center; }

  .tarjeta { background: var(--superficie); border: 2px solid var(--borde); border-radius: 40px; padding: 44px 48px; display: flex; flex-direction: column; gap: 22px; }
  .tarjeta .etq { font-size: 30px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tenue); }
  .tarjeta.mala { border-color: rgba(255,122,112,0.5); background: rgba(255,122,112,0.07); }
  .tarjeta.buena { border-color: rgba(111,211,160,0.55); background: rgba(111,211,160,0.08); }

  .fila { display: flex; align-items: center; gap: 28px; font-size: 46px; font-weight: 700; line-height: 1.15; }
  .fila .ico { flex: 0 0 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; font-size: 44px; font-weight: 900; }
  .ico.si { background: rgba(111,211,160,0.18); color: var(--verde); }
  .ico.no { background: rgba(255,122,112,0.18); color: var(--rojo); }
  .ico.n { background: rgba(127,177,234,0.18); color: var(--acento); }
  .fila small { display: block; font-size: 32px; font-weight: 500; color: var(--tenue); margin-top: 6px; }

  .par { display: flex; justify-content: space-between; align-items: baseline; font-size: 44px; font-weight: 600; color: var(--tenue);
    padding: 18px 0; border-bottom: 2px solid var(--borde); }
  .par:last-child { border-bottom: 0; }
  .par b { color: var(--tinta); font-weight: 800; font-size: 56px; }

  .tachable { position: relative; display: inline-block; }
  .tachable::after { content: ""; position: absolute; left: -2%; top: 52%; height: 12px; width: calc(var(--p, 0) * 104%);
    background: var(--rojo); border-radius: 6px; transform: rotate(-4deg); box-shadow: 0 0 0 4px rgba(11,18,32,0.4); }

  .sello { align-self: center; font-size: 84px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: var(--rojo);
    border: 10px solid var(--rojo); border-radius: 24px; padding: 10px 40px; transform: rotate(-8deg); }
  .sello.verde { color: var(--verde); border-color: var(--verde); }

  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .caja { border-radius: 36px; padding: 36px 34px; display: flex; flex-direction: column; gap: 10px; background: var(--superficie); border: 2px solid var(--borde); }
  .caja .etq { font-size: 28px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .caja .v { font-size: 86px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
  .caja .d { font-size: 32px; color: var(--tenue); font-weight: 600; line-height: 1.25; }
  .caja.gana { border-color: rgba(111,211,160,0.5); } .caja.gana .etq, .caja.gana .v { color: var(--verde); }
  .caja.pierde { border-color: rgba(255,122,112,0.5); } .caja.pierde .etq, .caja.pierde .v { color: var(--rojo); }

  /* Línea de tiempo vertical */
  .linea { display: flex; flex-direction: column; gap: 44px; position: relative; padding-left: 64px; }
  .linea::before { content: ""; position: absolute; left: 20px; top: 20px; bottom: 20px; width: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); }
  .hito { position: relative; display: flex; flex-direction: column; gap: 6px; }
  .hito::before { content: ""; position: absolute; left: -58px; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--acento); box-shadow: 0 0 0 8px rgba(127,177,234,0.18); }
  .hito.mal::before { background: var(--rojo); box-shadow: 0 0 0 8px rgba(255,122,112,0.18); }
  .hito.ok::before { background: var(--verde); box-shadow: 0 0 0 8px rgba(111,211,160,0.2); }
  .hito .f { font-size: 34px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); }
  .hito .t { font-size: 60px; font-weight: 800; line-height: 1.12; }
  .hito .x { font-size: 46px; font-weight: 700; color: var(--rojo); }

  /* Barra de años */
  .regla { position: relative; height: 120px; border-radius: 24px; background: rgba(255,255,255,0.07); overflow: hidden; border: 2px solid var(--borde); }
  .regla .seg { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; font-size: 30px; font-weight: 800; white-space: nowrap; }
  .regla-pie { display: flex; justify-content: space-between; font-size: 28px; color: var(--tenue); font-weight: 600; margin-top: -18px; }

  /* Eje de edades */
  .eje { position: relative; height: 230px; margin: 10px 10px 0; }
  .eje .barra { position: absolute; left: 0; right: 0; top: 104px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.12); }
  .eje .relleno { position: absolute; left: 0; top: 104px; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--verde), var(--ambar) 45%, var(--rojo)); width: calc(var(--p, 0) * 100%); }
  .eje .punto { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .eje .punto .e { font-size: 34px; font-weight: 800; }
  .eje .punto .pin { width: 34px; height: 34px; border-radius: 50%; margin-top: 18px; border: 7px solid var(--fondo); }
  .eje .punto .l { font-size: 28px; font-weight: 700; color: var(--tenue); white-space: nowrap; margin-top: 6px; text-align: center; line-height: 1.2; }

  .paso { display: flex; gap: 26px; align-items: flex-start; }
  .paso .num { flex: 0 0 84px; height: 84px; border-radius: 26px; background: var(--acento); color: #0b1220; font-size: 48px; font-weight: 900; display: grid; place-items: center; }
  .paso .tx { font-size: 46px; font-weight: 800; line-height: 1.12; padding-top: 8px; }
  .paso .tx small { display: block; font-size: 31px; font-weight: 500; color: var(--tenue); margin-top: 8px; line-height: 1.3; }

  .cta { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 36px; }
  .cta .icono { width: 170px; height: 170px; border-radius: 52px; background: linear-gradient(135deg, var(--acento-fuerte), #63a7f0); display: grid; place-items: center; box-shadow: 0 30px 80px rgba(61,134,224,0.45); }
  .cta .icono svg { width: 96px; height: 96px; }
  .url { font-size: 44px; font-weight: 800; color: var(--tinta); background: rgba(255,255,255,0.08); border: 2px solid var(--borde); padding: 16px 34px; border-radius: 999px; }
  .aviso { font-size: 25px; color: var(--tenue-2); font-weight: 500; line-height: 1.35; max-width: 860px; }

  /* ---------- Subtítulos ---------- */
  #subtitulos { position: absolute; left: 90px; right: 150px; top: 1300px; height: 200px; display: flex; align-items: flex-start; justify-content: center; text-align: center; }
  #subtitulos .bloque { font-size: 58px; font-weight: 800; line-height: 1.18; letter-spacing: -0.015em; text-wrap: balance;
    text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 0 30px rgba(0,0,0,0.6); }
  #subtitulos span { color: rgba(255,255,255,0.55); padding: 0 4px; border-radius: 12px; }
  #subtitulos span.dicha { color: #fff; }
  #subtitulos span.ahora { color: #14130f; background: var(--ambar); text-shadow: none; }

  /* Portada */
  body.portada #subtitulos, body.portada #progreso { display: none; }
  body.portada #escenario { top: 300px; height: 1320px; }
  body.portada .titular { font-size: 128px; }
  body.portada .cifra.xl { font-size: 250px; }
</style>
</head>
<body>
<div id="fondo"><div id="rejilla"></div><div id="marca-agua"></div></div>
<div id="cabecera">
  <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M8 44a24 24 0 0 1 48 0" fill="none" stroke="#7fb1ea" stroke-width="7" stroke-linecap="round"/>
      <path d="M8 44a24 24 0 0 1 14-21.8" fill="none" stroke="#6fd3a0" stroke-width="7" stroke-linecap="round"/>
      <line x1="32" y1="44" x2="46" y2="26" stroke="#f4f7fb" stroke-width="6" stroke-linecap="round"/>
      <circle cx="32" cy="44" r="6" fill="#f4f7fb"/>
    </svg>
    Jubilómetro
  </div>
  <div class="tema" id="tema"></div>
</div>
<div id="progreso"><i></i></div>
<div id="escenario"></div>
<div id="subtitulos"></div>

<script>
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const suave = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
  const salida = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
  const rebote = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const fmt = (v, dec) => v.toLocaleString("es-ES", { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: "always" });

  let D = null, escenas = [], subt = null;

  window.__init = (datos) => {
    D = datos;
    document.getElementById("tema").textContent = datos.tema || "";
    document.getElementById("marca-agua").textContent = datos.marcaAgua || "";
    const esc = document.getElementById("escenario");
    escenas = datos.escenas.map((e) => {
      const div = document.createElement("div");
      div.className = "escena " + (e.clase || "");
      div.innerHTML = e.html;
      esc.appendChild(div);
      const elems = [...div.querySelectorAll("[data-t], [data-a]")].map((el) => ({
        el, t: el.dataset.t !== undefined ? Number(el.dataset.t) : e.ini, a: el.dataset.a || "sube", dur: Number(el.dataset.dur || 0.45),
      }));
      return { ...e, div, elems };
    });
    subt = document.getElementById("subtitulos");
    if (datos.portada) document.body.classList.add("portada");
  };

  function animar(o, t) {
    const p = (t - o.t) / o.dur;
    const el = o.el;
    switch (o.a) {
      case "sube": { const q = salida(p); el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * 46}px)`; break; }
      case "aparece": { el.style.opacity = suave(p); break; }
      case "pop": { const q = rebote(p); el.style.opacity = clamp(p * 2.5); el.style.transform = `scale(${0.55 + 0.45 * q})`; break; }
      case "sello": { const q = salida(p); el.style.opacity = clamp(p * 3); el.style.transform = `rotate(-8deg) scale(${1.9 - 0.9 * q})`; break; }
      case "tacha": { el.style.setProperty("--p", salida(p)); break; }
      case "eje": { el.style.setProperty("--p", salida(p) * Number(el.dataset.hasta || 1)); break; }
      case "ancho": { el.style.width = `${salida(p) * Number(el.dataset.ancho)}%`; break; }
      case "cuenta": {
        const desde = Number(el.dataset.desde || 0), hasta = Number(el.dataset.valor), dec = Number(el.dataset.dec || 0);
        const q = salida((t - o.t) / Number(el.dataset.dur || 0.9));
        el.textContent = (el.dataset.pre || "") + fmt(desde + (hasta - desde) * q, dec) + (el.dataset.suf || "");
        el.style.opacity = clamp(p * 4);
        break;
      }
      case "fijo": break;
    }
  }

  window.__frame = (t) => {
    const total = D.duracion;
    document.documentElement.style.setProperty("--gx", `${20 + 8 * Math.sin(t * 0.25)}%`);
    document.documentElement.style.setProperty("--gy", `${18 + 5 * Math.cos(t * 0.2)}%`);
    document.documentElement.style.setProperty("--hx", `${84 + 6 * Math.cos(t * 0.22)}%`);
    document.documentElement.style.setProperty("--hy", `${86 + 5 * Math.sin(t * 0.18)}%`);
    document.getElementById("rejilla").style.setProperty("--ry", `${(t * 14) % 90}px`);
    document.querySelector("#progreso i").style.width = `${clamp(t / total) * 100}%`;

    for (const e of escenas) {
      const entra = e.ini <= 0 ? 1 : salida((t - e.ini) / 0.28);
      const sale = e.fin >= total ? 1 : 1 - suave((t - (e.fin - 0.2)) / 0.2);
      const v = t < e.ini || t > e.fin ? 0 : Math.min(entra, sale);
      e.div.style.opacity = v;
      e.div.style.visibility = v > 0 ? "visible" : "hidden";
      if (v <= 0) continue;
      const zoom = 1 + 0.025 * clamp((t - e.ini) / Math.max(1, e.fin - e.ini));
      e.div.style.transform = `translateY(${(1 - entra) * 30}px) scale(${zoom})`;
      for (const o of e.elems) animar(o, t);
    }

    if (!D.subtitulos) return;
    const s = D.subtitulos.find((b) => t >= b.ini && t < b.fin);
    const clave = s ? s.ini : null;
    if (subt.dataset.clave != String(clave)) {
      subt.dataset.clave = String(clave);
      subt.innerHTML = s ? `<div class="bloque">${s.palabras.map((w) => `<span>${w.texto}</span>`).join(" ")}</div>` : "";
    }
    if (s) {
      const spans = subt.querySelectorAll("span");
      s.palabras.forEach((w, i) => {
        spans[i].className = t >= w.ini ? (t < w.fin + 0.05 && (i === s.palabras.length - 1 || t < s.palabras[i + 1].ini) ? "ahora" : "dicha") : "";
      });
      const q = salida((t - s.ini) / 0.18);
      subt.firstChild.style.transform = `translateY(${(1 - q) * 18}px)`;
      subt.firstChild.style.opacity = q;
    }
  };
</script>
</body>
</html>
